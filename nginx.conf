# Nginx configuration for ModelForge
# Place this file at: /etc/nginx/sites-available/modelforge
# Then: sudo ln -s /etc/nginx/sites-available/modelforge /etc/nginx/sites-enabled/

# ── HTTP → HTTPS redirect ────────────────────────────────────────
# (Only needed if you have a domain + SSL certificate)
# Uncomment this block after running certbot:
#
# server {
#     listen 80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# ── Main server block ─────────────────────────────────────────────
server {
    # Change to 443 ssl and add SSL lines below after running certbot
    listen 80;
    server_name _;   # Replace _ with your domain or public IP

    # Max upload size (for image uploads)
    client_max_body_size 50M;

    # ── Frontend (Next.js on :3000) ───────────────────────────
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Backend API (FastAPI on :8000) ────────────────────────
    location /api/ {
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Increase timeouts for long training requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    # ── SSL (added automatically by certbot — do not edit manually) ──
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}
