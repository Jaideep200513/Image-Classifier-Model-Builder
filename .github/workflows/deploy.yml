name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment to Oracle Cloud VM..."
            
            # 1. Navigate to exact project directory on VM
            cd /home/ubuntu/Image-Classifier-Model-Builder || exit 1
            
            # 2. Sync latest code from main branch
            git fetch origin main
            git reset --hard origin/main
            
            echo "📌 Deployed Commit:"
            git log -1 --oneline
            
            # 3. Rebuild and restart Docker Compose containers
            echo "🐳 Rebuilding and starting Docker Compose stack..."
            docker compose down --remove-orphans || true
            docker compose up -d --build
            
            # 4. Print container status
            echo "📊 Active Container Status:"
            docker compose ps
            
            echo "✅ Deployment to http://140.245.221.99:3000 completed successfully!"
